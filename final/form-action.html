<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinSmart – Thank You | Feedback Received</title>
  <meta name="description" content="Confirmation page shown after submitting feedback to FinSmart." />
  <meta name="author" content="FinSmart Project" />
  <meta name="theme-color" content="#0a6cff" />
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="stylesheet" href="styles/small.css" />
  <link rel="stylesheet" href="styles/large.css" />
</head>

<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="FinSmart home">
        <span class="brand-mark" aria-hidden="true">💰</span>
        <span class="brand-name">FinSmart</span>
      </a>
      <nav id="primary-nav" class="primary-nav" aria-label="Primary">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="tools.html">Tools</a></li>
          <li><a href="resources.html">Resources</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="container thankyou">
    <h1>Thank you, <span id="display-name">friend</span>!</h1>
    <p>Your feedback has been received. Here's a summary of what you sent:</p>

    <dl class="summary">
      <dt>Name</dt>
      <dd id="display-name-2">—</dd>
      <dt>Email</dt>
      <dd id="display-email">—</dd>
      <dt>Topic</dt>
      <dd id="display-topic">—</dd>
      <dt>Message</dt>
      <dd id="display-message">—</dd>
    </dl>

    <a class="btn btn-primary" href="tools.html">Back to tools</a>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; <span id="year"></span> FinSmart &middot; Built for students, by a student.</p>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    const params = new URLSearchParams(window.location.search);
    document.getElementById("display-name").textContent = params.get("name") || "friend";
    document.getElementById("display-name-2").textContent = params.get("name") || "—";
    document.getElementById("display-email").textContent = params.get("email") || "—";
    document.getElementById("display-topic").textContent = params.get("topic") || "—";
    document.getElementById("display-message").textContent = params.get("message") || "—";
  </script>
</body>

</html>
